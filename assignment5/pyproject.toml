[project]
name = "assignment5"
version = "0.1.0"
description = "Point cloud classification and segmentation"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.8.0",
    "pytorch3d==0.7.9+pt2.8.0cu128",
    "imageio",
    "matplotlib",
    "numpy<2.0.0",
    "PyMCubes",
    "tqdm",
    "scipy",
    "tensorboard",
    "markdown",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
pytorch3d = { index = "pytorch3d" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch3d"
url = "https://miropsota.github.io/torch_packages_builder"
explicit = true
